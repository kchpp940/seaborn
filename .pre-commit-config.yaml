repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
        exclude: \.svg$
-   repo: local
    hooks:
    -   id: check-deps
        name: extras consistency
        entry: python3 ci/check_extras_consistency.py
        language: system
        pass_filenames: false
    -   id: flake8
        name: flake8
        entry: flake8
        language: system
        exclude: seaborn/(cm\.py|external/)
        types: [file, python]
    -   id: mypy
        name: mypy
        entry: mypy
        language: system
        args: [--follow-imports=skip]
        files: seaborn/_(core|marks|stats)/
        types: [file, python]

